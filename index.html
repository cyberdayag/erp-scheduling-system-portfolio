<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Scheduling System</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    :root {
      --primary: #1f3864;
      --accent: #2e75b6;
      --bg: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      width: 281px;
      max-width: 90%;
      height: auto;
      margin: -180px auto 12px;
      display: block;
    }

    .tagline {
      font-size: 1rem;
      font-weight: 400;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .chip-list {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .chip {
      display: flex;
      flex: 1 1 220px;
      align-items: center;
      justify-content: center;
      padding: 22px 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .chip:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(46, 117, 182, 0.15);
    }

    .chip span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 4px;
    }

    .chip.disabled {
      cursor: default;
      opacity: 0.55;
    }

    .chip.disabled:hover {
      border-color: var(--border);
      box-shadow: none;
    }

    .chip .soon-badge {
      display: inline-block;
      margin-left: 8px;
      margin-top: 0;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #fff;
      background: var(--muted);
      border-radius: 999px;
      vertical-align: middle;
    }

    footer {
      margin-top: 23px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="logo" src="img/logo.png" alt="ERP Scheduling System">
    <div class="tagline">ERP Scheduling System</div>

    <div class="chip-list">
      <a class="chip" href="portfolio-case-en.html">Case study</a>
      <a class="chip" href="overview/scheduling_system_overview_en.html">Technical overview</a>
      <div class="chip disabled" aria-disabled="true">Live demo<span class="soon-badge">Soon</span></div>
    </div>

    <footer>
      <a href="mailto:cyberdayag@gmail.com">cyberdayag@gmail.com</a>
    </footer>
  </div>
</body>

</html>
